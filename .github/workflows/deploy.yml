name: Deploy to Netlify

# Netlify's own git-integration continuous deployment -- the thing that used
# to build and publish this site automatically on every push -- isn't
# available for a private repo without a paid Netlify plan. This replaces it:
# GitHub Actions builds the project and pushes the result to Netlify itself
# via the Netlify CLI, using a personal access token instead of Netlify's
# repo access. Works the same whether the repo is public or private.
on:
  push:
    branches: [main]
  # Lets a deploy be retried (e.g. after fixing a bad NETLIFY_AUTH_TOKEN)
  # without needing a throwaway commit to main just to re-trigger the push
  # event, and lets a draft (non-production) deploy be requested for
  # verification -- see the `prod` input below.
  workflow_dispatch:
    inputs:
      prod:
        description: "Publish to production (unchecked = draft preview deploy only, safe to test with)"
        type: boolean
        default: false

concurrency:
  # A second push landing mid-deploy queues behind the first rather than
  # racing it -- two overlapping production deploys could publish out of
  # order and leave main pointing at an older build. Draft deploys triggered
  # by hand don't touch production, so they're left free to run alongside.
  group: netlify-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same cache as e2e.yml's jobs -- keyed on the lockfile, so this only
      # pays for a real `npm ci` when dependencies actually changed.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'

      # Nitro's `netlify` preset (nuxt.config.ts) already produces
      # Netlify-shaped output on its own -- `dist/` for static assets *and*
      # `.netlify/functions-internal/server` for the serverless function that
      # handles every SSR page and `/api/*` route. Confirmed locally: a plain
      # `npm run build` writes both, no Netlify tooling involved.
      - run: npm run build

      # Deliberately NOT `netlify deploy --build`. `--build` hands the build
      # to Netlify's own build system (@netlify/build) instead of using the
      # one just run above -- and that's the same build infrastructure
      # that's gated behind a paid plan for a private repo, regardless of
      # whether it's triggered by a git webhook or this CLI flag. That's
      # exactly what the first three runs of this workflow hit: `netlify
      # status` (pure auth check, no build) succeeded with this same token,
      # but `deploy --build` failed immediately with 403 Forbidden. Plain
      # `deploy` -- upload and publish an already-built artifact -- is a
      # more basic action that doesn't touch that infrastructure at all.
      #
      # `prod` defaults to false so a manual run is a draft deploy (its own
      # throwaway preview URL, printed in this step's log) -- safe to use to
      # confirm the API routes/SSR actually work before ever publishing to
      # production. A push to main always deploys for real; that's the
      # whole point of this workflow.
      - name: Deploy to Netlify
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.prod }}" = "true" ]; then
            npx netlify-cli@27.5.2 deploy --prod
          else
            npx netlify-cli@27.5.2 deploy
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # Not a secret -- a site's API ID is not sensitive information,
          # only its auth token is. app.quiroflow.com's Netlify site.
          NETLIFY_SITE_ID: 8a81ed5a-0561-4e1d-891a-163a223d99f8

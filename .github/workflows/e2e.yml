name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run preflight

  cypress:
    strategy:
      fail-fast: false
      # Manual sharding, no Cypress Cloud recording configured (that's what
      # unlocks --parallel/--record). Each shard still pays its own npm
      # ci + supabase start cost, but in parallel with the others -- a
      # worthwhile trade once actual Cypress runtime dominates the fixed
      # per-job setup cost, as it does once there's more than a couple
      # specs.
      #
      # Balanced by folder, not by individual spec file: per-spec Cypress
      # runtimes from PR #75's final green run (commit 1dea42e) were
      # navigation 56s, settings 54s, inbox 22s, calendar 21s, auth 21s,
      # patients 19s, public-booking 8s -- the previous grouping (by
      # top-level folder, but grouped without ever looking at these numbers)
      # put navigation+inbox+patients together at 98s against auth+calendar
      # at 42s, the widest shard 56s slower than the narrowest. This grouping
      # gets all three shards within 9s of each other (73/64/64) using the
      # same folder-glob approach, which is what keeps a spec added to an
      # existing folder auto-included in its shard -- no drift risk the way
      # slicing at individual-file granularity would have. Durations will
      # drift as specs are added; rebalance again once one shard consistently
      # lags, same as before.
      matrix:
        shard:
          - name: settings-and-patients
            specs: "cypress/e2e/settings/**,cypress/e2e/patients/**"
          - name: navigation-and-booking
            specs: "cypress/e2e/navigation/**,cypress/e2e/public-booking/**"
          - name: auth-calendar-inbox
            specs: "cypress/e2e/auth/**,cypress/e2e/calendar/**,cypress/e2e/inbox/**"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          # Pinned instead of "latest" -- resolving "latest" queries GitHub's
          # API on every run, across every shard and every PR, and hitting
          # that endpoint's rate limit fails the job before any test runs
          # (PR #17's inbox-nav-patients shard: "Failed to resolve latest
          # Supabase CLI release: rate limit exceeded"). Bump this by hand
          # when there's a reason to (a CLI feature/fix this suite needs).
          version: 2.116.0

      - name: Start local Supabase (in the background)
        # Backgrounded so it overlaps `npm ci` instead of queueing behind it:
        # the two share no state and together were ~90s of dead serial time
        # before any test ran. The wait step below is what actually gates on
        # it, so a slow start still blocks Cypress -- it just no longer
        # blocks dependency install too.
        #
        # Excludes containers this suite never touches, cutting both image
        # pulls and startup/health-check time: no supabase/functions/ exists
        # (edge-runtime unused), no spec reads Mailpit's inbox and
        # auth.email.enable_confirmations is off anyway (mailpit unused),
        # and studio/postgres-meta/logflare/vector only serve the local
        # Studio UI, never the app itself. Local dev (plain `supabase
        # start`, no -x) still gets the full stack -- this only trims CI.
        run: |
          nohup supabase start -x studio,edge-runtime,logflare,vector,mailpit,postgres-meta \
            > /tmp/supabase-start.log 2>&1 &
          echo $! > /tmp/supabase-start.pid

      - run: npm ci

      - name: Wait for Supabase and export its env vars
        run: |
          pid="$(cat /tmp/supabase-start.pid)"
          # Not `wait`: that only works on children of the current shell, and
          # each workflow step runs in its own. Poll the pid, then let
          # `supabase status` be the actual health check -- the backgrounded
          # start's exit code isn't reachable from here either.
          for _ in $(seq 1 300); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          cat /tmp/supabase-start.log
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::supabase start still running after 300s"
            exit 1
          fi
          if ! supabase status -o env > /tmp/supabase-status.env 2>&1; then
            echo "::error::supabase start did not bring up a healthy stack"
            cat /tmp/supabase-status.env
            exit 1
          fi
          sed -n 's/^API_URL="\(.*\)"/NUXT_PUBLIC_SUPABASE_URL=\1/p;s/^ANON_KEY="\(.*\)"/NUXT_PUBLIC_SUPABASE_KEY=\1/p;s/^SERVICE_ROLE_KEY="\(.*\)"/NUXT_SUPABASE_SECRET_KEY=\1/p' \
            /tmp/supabase-status.env >> "$GITHUB_ENV"

      - name: Run Cypress (${{ matrix.shard.name }})
        run: npx start-server-and-test dev http://localhost:3000 "cypress run --spec '${{ matrix.shard.specs }}'"
        env:
          CYPRESS_baseUrl: http://localhost:3000

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.shard.name }}
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Stop Supabase
        if: always()
        run: supabase stop

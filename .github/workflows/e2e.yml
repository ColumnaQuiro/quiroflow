name: CI

# Pull requests only, deliberately. This used to also run on push to main,
# which cost a second full ~28 minutes of runner time per merge and bought
# nothing: by then the merge has already happened, so a failure can't block
# it, and deploy.yml runs on the same event rather than after this one, so
# a failure can't stop the deploy either -- production was live ~2.5
# minutes before this finished. That run was pure cost, and it isn't free
# any more now the repo is private (Actions minutes are metered on the
# org's Free plan; public repos get them unlimited).
#
# What still protects main: GitHub runs these checks against the simulated
# merge result on every PR, so what CI tests is what main becomes. Branch
# protection can't enforce "green before merge" here -- that needs GitHub
# Pro or a public repo -- so it stays a convention, the same one CLAUDE.md
# already describes.
on:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # setup-node's `cache: npm` only restores npm's download cache -- the
      # install itself still unpacks 1102 packages, measured at 28s on every
      # job of every run. Caching the installed tree instead turns that into
      # a ~5s restore, and the key is the lockfile, so any dependency change
      # falls through to a real `npm ci`.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'

      - run: npm run preflight

      # `nuxi typecheck` does NOT compile templates, so it passes on a tree
      # that cannot build. A stray `v-else` whose sibling `v-if` had been
      # edited away reached main that way: preflight reported clean, every
      # route then 500'd on "v-else/v-else-if has no adjacent v-if or
      # v-else-if", and CI only noticed via three Cypress shards failing on
      # pages unrelated to the change -- by which point production was
      # already serving it.
      #
      # Measured at 59s against ~47s for preflight, in a job that finishes
      # minutes inside the Cypress shards it runs alongside, so this costs
      # nothing in wall-clock time and turns that class of break into a
      # named error in the job that exists to catch it.
      - run: npm run build

  cypress:
    strategy:
      fail-fast: false
      # Manual sharding, no Cypress Cloud recording configured (that's what
      # unlocks --parallel/--record). Each shard still pays its own npm
      # ci + supabase start cost, but in parallel with the others -- a
      # worthwhile trade once actual Cypress runtime dominates the fixed
      # per-job setup cost, as it does once there's more than a couple
      # specs.
      #
      # Balanced by folder, not by individual spec file, so a spec added to
      # an existing folder is auto-included in its shard -- slicing at
      # file granularity would silently drop a new spec from every shard.
      #
      # Measured on the run for commit 71ecdfd (2026-09-11), Cypress time
      # only, excluding the ~2min 20s of fixed setup every shard pays:
      # settings 115s, patients+public 83s, auth+calendar+inbox ~65s,
      # navigation 59s. Settings was nearly double the narrowest and its job
      # was the one that decided how long CI took, so its four subscription
      # specs move to their own folder and their own shard.
      #
      # They move FOLDER rather than being picked out by filename glob: a
      # shard is a folder glob so that a spec added to an existing folder is
      # auto-included, and there is no way to express "settings except
      # subscription-*" that keeps that property -- a new settings spec would
      # have landed in no shard at all.
      #
      # public/** rides with subscription/** purely for balance (74s together
      # against 62s for settings). That is only ~8s better than leaving it
      # with patients, which is inside the run-to-run variance seen on these
      # specs, so it is not worth defending if a later regrouping wants it
      # back.
      #
      # Cypress time per shard, measured against the built server (see the
      # build step below) rather than estimated: growth-leads 2m41,
      # growth-platform 2m16, patients 1m27, settings 50s, calendar 47s,
      # navigation 17s, the rest under 30s each.
      # Those numbers replace a set that had gone badly stale -- it claimed
      # every shard ran in about a minute while growth was taking 8m25.
      #
      # Growth is now the whole critical path and cannot be split here:
      # shards are folder globs on purpose, because that is what lets
      # check-e2e-shards.mjs prove every folder runs somewhere. Listing
      # individual spec files would balance the clock and reopen the hole it
      # closed -- a new growth spec would belong to no shard and never run.
      # Splitting growth means splitting the folder, or teaching that script
      # about file-level shards first.
      #
      # Rebalance from the real per-spec numbers in the "All specs passed"
      # table, never by guessing: that is how settings came to be mis-sized
      # before, from a stale table with a truncated spec name.
      matrix:
        shard:
          - name: settings
            specs: "cypress/e2e/settings/**"
          - name: subscription-and-public
            specs: "cypress/e2e/subscription/**,cypress/e2e/public/**"
          - name: navigation
            # dashboard rides along here rather than taking a shard of its own:
            # both are "does an app page render the right thing", and a new
            # shard is a whole extra CI job for two specs.
            specs: "cypress/e2e/navigation/**,cypress/e2e/dashboard/**"
          # Its own shard rather than folded into an existing one: Growth is
          # mid-build and this folder is the one still growing -- receptionist,
          # automations and reputation specs are still to come. scripts/
          # check-e2e-shards.mjs is what noticed it had no shard at all, after
          # two spec files had already merged and never run.
          # Growth is split because as one shard it was the whole critical
          # path: 237s against the next-slowest 87s. The halves are balanced
          # on measured time, not spec count: leads 2m41, platform 2m16.
          #
          # growth-leads takes a prefix glob, so a new growth-lead-*.cy.ts
          # joins it with no workflow edit; growth-receptionist* is a glob for
          # the same reason. The rest of growth-platform names its specs,
          # which means a new non-lead growth spec matches nothing and
          # check-e2e-shards.mjs fails until someone assigns it. That is the
          # trade for splitting a folder, and the failure is the point: the
          # alternative is a spec that never runs and says nothing.
          - name: growth-leads
            specs: "cypress/e2e/growth/growth-lead*.cy.ts,cypress/e2e/growth/growth-inbox.cy.ts"
          - name: growth-platform
            specs: "cypress/e2e/growth/growth-receptionist*.cy.ts,cypress/e2e/growth/growth-reputation.cy.ts,cypress/e2e/growth/growth-dashboard-data.cy.ts,cypress/e2e/growth/growth-dashboard.cy.ts,cypress/e2e/growth/growth-automations.cy.ts,cypress/e2e/growth/growth-automation-builder.cy.ts,cypress/e2e/growth/growth-addon-entitlement.cy.ts,cypress/e2e/growth/growth-review-links.cy.ts,cypress/e2e/growth/growth-campaign-templates.cy.ts,cypress/e2e/growth/growth-email-metrics.cy.ts"
          # Patients is split by first letter because it grew to 55 specs and
          # 351s of Cypress on one runner, against 213s for the next-slowest --
          # the whole run waited on it (run 35835560318, 2026-09-23). Cut at
          # "p" on measured per-spec time: a-o 186s, the rest plus booking
          # 165s.
          #
          # A character class rather than named files, because [a-o] and
          # [!a-o] are complementary: every file in the folder matches exactly
          # one of them, so a new patients spec still lands in a shard with no
          # workflow edit, which is the property folder globs exist for. Move
          # the letter to rebalance; check-e2e-shards.mjs proves the halves
          # still cover the folder exactly once.
          - name: patients-a-o
            specs: "cypress/e2e/patients/[a-o]*.cy.ts"
          - name: patients-p-z-and-booking
            specs: "cypress/e2e/patients/[!a-o]*.cy.ts,cypress/e2e/public-booking/**"
          - name: auth-calendar-inbox
            specs: "cypress/e2e/auth/**,cypress/e2e/calendar/**,cypress/e2e/inbox/**"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The CLI is cached and fetched by hand rather than through
      # supabase/setup-cli, which downloads it on every job of every run --
      # seven times per push here, and it only takes one bad response to fail
      # a shard before a single test runs. That has now happened twice for
      # two different reasons: resolving "latest" hit GitHub's API rate limit
      # (PR #17), and the release download itself returned 500 three times in
      # a row (#280). The action retries twice and gives up; a 500 outlasts
      # that.
      #
      # So: restore from cache, and on a miss fetch it with retries that
      # actually cover an outage. Keyed by version, so bumping VERSION below
      # is all it takes to pick up a new one -- and the tarball is 54MB
      # fetched once per version rather than seven times per push.
      - name: Restore the Supabase CLI
        id: supabase-cli
        uses: actions/cache@v4
        with:
          path: ~/.supabase-cli
          key: supabase-cli-${{ runner.os }}-${{ runner.arch }}-2.116.0

      - name: Download the Supabase CLI
        if: steps.supabase-cli.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.supabase-cli
          # --retry-all-errors is what makes this survive the 5xx that beat
          # the action: plain --retry ignores HTTP errors entirely.
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz \
            | tar -xz -C ~/.supabase-cli supabase
          chmod +x ~/.supabase-cli/supabase

      - name: Put the Supabase CLI on PATH
        run: |
          echo "$HOME/.supabase-cli" >> "$GITHUB_PATH"
          "$HOME/.supabase-cli/supabase" --version

      - name: Start local Supabase (in the background)
        # Backgrounded so it overlaps `npm ci` instead of queueing behind it:
        # the two share no state and together were ~90s of dead serial time
        # before any test ran. The wait step below is what actually gates on
        # it, so a slow start still blocks Cypress -- it just no longer
        # blocks dependency install too.
        #
        # Excludes containers this suite never touches, cutting both image
        # pulls and startup/health-check time: no supabase/functions/ exists
        # (edge-runtime unused), no spec reads Mailpit's inbox and
        # auth.email.enable_confirmations is off anyway (mailpit unused),
        # and studio/postgres-meta/logflare/vector only serve the local
        # Studio UI, never the app itself. Local dev (plain `supabase
        # start`, no -x) still gets the full stack -- this only trims CI.
        run: |
          nohup supabase start -x studio,edge-runtime,logflare,vector,mailpit,postgres-meta \
            > /tmp/supabase-start.log 2>&1 &
          echo $! > /tmp/supabase-start.pid

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      # The Cypress binary lives in ~/.cache/Cypress, not node_modules, and is
      # fetched by Cypress's postinstall -- which never runs when the
      # node_modules cache hits. Cached separately so neither half can be
      # restored without the other, and installed explicitly in the one case
      # where the tree is cached but the binary isn't.
      - name: Restore the Cypress binary
        id: cypress-binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'

      - name: Install the Cypress binary
        if: steps.modules.outputs.cache-hit == 'true' && steps.cypress-binary.outputs.cache-hit != 'true'
        run: npx cypress install

      # `cache: npm` on setup-node caches npm's own package cache, not the
      # Cypress binary, which lives outside node_modules in ~/.cache/Cypress.
      # When the npm cache hits, `npm ci` treats cypress as already installed
      # and skips the postinstall that downloads the binary -- so the job dies
      # with "the Cypress binary is missing" before a single test runs. That
      # is what took out the navigation-and-booking shard on PR #163 while the
      # other two shards passed: a cache-state coincidence, not a test failure.
      #
      # Keyed on the resolved Cypress version so a version bump misses the
      # cache and re-downloads rather than restoring a stale binary.
      - name: Read the Cypress version
        id: cypress-version
        run: echo "version=$(node -p "require('cypress/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ steps.cypress-version.outputs.version }}

      # Idempotent: a no-op costing under a second when the cache restored the
      # binary, and the thing that makes a cache miss recoverable instead of
      # fatal.
      - run: npx cypress install

      # Built here, in the window the backgrounded `supabase start` has
      # already claimed. Cypress used to run against `nuxt dev`, which
      # compiles each route the first time a spec visits it -- so every shard
      # paid Vite's compile cost again, spec after spec. Measured on this
      # suite, serving a build instead:
      #
      #   navigation  1m06 -> 0m17     (walks every page; the best case)
      #   settings    1m27 -> 0m50
      #
      # The build costs ~60-90s, which is roughly what the step below spends
      # waiting for Postgres to come up anyway. Putting it here means the
      # shard pays for it out of dead time rather than adding to the run.
      #
      # node-server, not the netlify preset production ships: that one emits
      # a function bundle with no server to start. It is still far closer to
      # production than the dev server was -- same bundling, same SSR path,
      # no on-demand compilation. The typecheck job still builds with the
      # real preset, so the production output keeps its own gate.
      - name: Build the app the specs will run against
        run: npm run build
        env:
          NITRO_PRESET: node-server

      - name: Wait for Supabase and export its env vars
        run: |
          pid="$(cat /tmp/supabase-start.pid)"
          # Not `wait`: that only works on children of the current shell, and
          # each workflow step runs in its own. Poll the pid, then let
          # `supabase status` be the actual health check -- the backgrounded
          # start's exit code isn't reachable from here either.
          for _ in $(seq 1 300); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          cat /tmp/supabase-start.log
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::supabase start still running after 300s"
            exit 1
          fi
          if ! supabase status -o env > /tmp/supabase-status.env 2>&1; then
            echo "::error::supabase start did not bring up a healthy stack"
            cat /tmp/supabase-status.env
            exit 1
          fi
          sed -n 's/^API_URL="\(.*\)"/NUXT_PUBLIC_SUPABASE_URL=\1/p;s/^ANON_KEY="\(.*\)"/NUXT_PUBLIC_SUPABASE_KEY=\1/p;s/^SERVICE_ROLE_KEY="\(.*\)"/NUXT_SUPABASE_SECRET_KEY=\1/p' \
            /tmp/supabase-status.env >> "$GITHUB_ENV"

      - name: Run Cypress (${{ matrix.shard.name }})
        # The built server, not `nuxt dev` -- see the build step above. Env
        # reaches it at runtime (NUXT_PUBLIC_*), which is why building before
        # Supabase is up is fine.
        run: npx start-server-and-test "node .output/server/index.mjs" http://localhost:3000 "cypress run --spec '${{ matrix.shard.specs }}'"
        env:
          CYPRESS_baseUrl: http://localhost:3000
          PORT: 3000
          # The automation crons refuse an unsigned call, so a spec that drives
          # one needs the same secret the server checks. A fixed value: it
          # guards a local, ephemeral stack, and a real secret in the workflow
          # file would be worse in every way.
          NUXT_CRON_SECRET: e2e-cron-secret
          CYPRESS_CRON_SECRET: e2e-cron-secret
          # Same reasoning for the Resend delivery webhook: the endpoint
          # verifies a Svix signature, so a spec proving it accepts a genuine
          # event has to be able to produce one. Fixed, and base64 because the
          # verifier decodes it. A spec that could not sign correctly would
          # only ever prove the endpoint rejects things.
          NUXT_RESEND_WEBHOOK_SECRET: whsec_dGVzdC1zZWNyZXQtZm9yLWN5cHJlc3M=
          CYPRESS_RESEND_WEBHOOK_SECRET: whsec_dGVzdC1zZWNyZXQtZm9yLWN5cHJlc3M=
          # The platform Meta app's secret, which signs the webhooks of every
          # clinic onboarded through Embedded Signup. Set here so a spec can
          # prove such a clinic is accepted WITHOUT a row in
          # whatsapp_app_secrets -- unset, that path cannot be reached at all
          # and the fallback would be the only thing ever tested.
          NUXT_META_PLATFORM_APP_SECRET: e2e-meta-platform-app-secret
          CYPRESS_META_PLATFORM_APP_SECRET: e2e-meta-platform-app-secret
          # Points the connect callback at a local stub instead of Meta. The
          # port is fixed because Nuxt reads this once at startup, so it must
          # be known before the server boots -- unlike the PracticeHub stub,
          # whose URL is per-account and can take a random port.
          #
          # Without this the callback made LIVE calls to graph.facebook.com
          # from CI, which started the moment metaPlatformAppId stopped being
          # blank and the "not configured" branch stopped catching it.
          NUXT_META_GRAPH_BASE_URL: http://127.0.0.1:9147

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.shard.name }}
          path: cypress/screenshots
          if-no-files-found: ignore

      # No "supabase stop" step: the runner is ephemeral and is torn down with
      # its containers seconds later, so stopping them by hand bought nothing
      # and cost a measured 11s at the end of every shard.

  # One stable check for branch protection to require.
  #
  # The matrix jobs above are named after their shard parameters --
  # "cypress (settings-and-patients, cypress/e2e/settings/**,...)" -- so
  # requiring them by name breaks the moment a shard is renamed or
  # rebalanced: the old name stays required, never reports again, and every
  # pull request is blocked until someone edits the protection rule. This
  # job's name never changes, and `needs` keeps it honest -- adding a job to
  # this workflow means adding it here, not editing repository settings.
  ci:
    name: ci
    # always(), or a failed dependency would skip this job rather than fail
    # it, and a skipped required check reads as "not failed" to some tooling.
    if: always()
    needs: [typecheck, cypress]
    runs-on: ubuntu-latest
    steps:
      - name: Report whether every job passed
        run: |
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "cypress:   ${{ needs.cypress.result }}"
          if [ "${{ needs.typecheck.result }}" != "success" ] || [ "${{ needs.cypress.result }}" != "success" ]; then
            echo "::error::CI did not pass"
            exit 1
          fi

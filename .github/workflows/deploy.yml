name: Deploy to Netlify

# Netlify's own git-integration continuous deployment -- the thing that used
# to build and publish this site automatically on every push -- isn't
# available for a private repo without a paid Netlify plan. This replaces it:
# GitHub Actions builds the project and pushes the result to Netlify itself
# via the Netlify CLI, using a personal access token instead of Netlify's
# repo access. Works the same whether the repo is public or private.
#
# Releases, not every merge. Merging a PR no longer ships anything: a deploy
# happens when a GitHub release is published, so several merges batch into one
# deploy chosen deliberately.
#
# The reason is arithmetic: a production deploy costs 15 Netlify credits, and
# it is charged per deploy regardless of how small the change was. One deploy
# per merge spends that on every typo fix. Three merges on 13 Sep cost 45
# credits between them and exhausted the allowance, at which point deploys are
# refused with a bare `JSONHTTPError: Forbidden` from the CLI -- the same error
# the "Enforce deployment methods" setting gives, which makes it easy to chase
# the wrong cause.
#
# The cost of that: `main` and production are no longer the same thing. What is
# merged is not live until someone cuts a release, which applies to a security
# fix exactly as much as to a feature. Check what production is actually
# running before concluding a merged fix is in effect.
on:
  release:
    types: [published]
  # Lets a deploy be retried (e.g. after fixing a bad NETLIFY_AUTH_TOKEN, or
  # once a usage allowance resets) without cutting a throwaway release just to
  # re-trigger the event, and lets a draft (non-production) deploy be requested
  # for verification -- see the `prod` input below.
  workflow_dispatch:
    inputs:
      prod:
        description: "Publish to production (unchecked = draft preview deploy only, safe to test with)"
        type: boolean
        default: false
      ref:
        description: "Tag, branch or SHA to build (blank = the branch this run was started from)"
        type: string
        required: false

concurrency:
  # A second release published mid-deploy queues behind the first rather than
  # racing it -- two overlapping production deploys could publish out of
  # order and leave the site on an older build. Draft deploys triggered
  # by hand don't touch production, so they're left free to run alongside.
  group: netlify-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The release's own tag, not whatever main happens to be at now. A
      # release names a specific commit; building main instead would ship
      # anything merged in the minutes since, which is exactly the surprise
      # this change exists to avoid. Falls back to the run's own ref for a
      # manual dispatch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same cache as e2e.yml's jobs -- keyed on the lockfile, so this only
      # pays for a real `npm ci` when dependencies actually changed.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'

      # Stops a release whose schema is not in the database yet.
      #
      # Nothing here has ever applied a migration -- this workflow builds and
      # uploads, and that is all -- so a migration could merge, pass CI, ride a
      # release into production and leave its columns missing, with the deploy
      # still green. It happened twice on 15 Sep; the second time v1.9.0 went
      # live with a Billing tab reading payments.created_by against a table
      # that had no such column, and every patient's ledger failed until
      # someone noticed.
      #
      # A check rather than a `db push`: applying DDL as a side effect of a
      # release is a much bigger promise than verifying agreement, and a failed
      # deploy leaves production exactly as it was, which an applied migration
      # does not. Runs BEFORE the build so a mismatch costs seconds rather than
      # a full build, and before the upload so production is never touched.
      - name: Check every migration in this build is applied
        run: npm run check:migrations-applied
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Scheduling a cron job is a manual step against production (see
      # 0081_enable_pg_cron.sql for why it cannot live in a migration), so it
      # is a step that can be forgotten -- and an endpoint nobody calls looks
      # exactly like one with nothing to do. lead-sequence-cron shipped on
      # 14 Sep and had never run by the 16th. Same placement and same
      # reasoning as the migration check above: a check, never a fix.
      - name: Check every cron endpoint is actually scheduled
        run: npm run check:crons-scheduled
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Nitro's `netlify` preset (nuxt.config.ts) already produces
      # Netlify-shaped output on its own -- `dist/` for static assets *and*
      # `.netlify/functions-internal/server` for the serverless function that
      # handles every SSR page and `/api/*` route. Confirmed locally: a plain
      # `npm run build` writes both, no Netlify tooling involved.
      - run: npm run build

      # Deliberately NOT `netlify deploy --build`. `--build` hands the build
      # to Netlify's own build system (@netlify/build) instead of using the
      # one just run above -- and that's the same build infrastructure
      # that's gated behind a paid plan for a private repo, regardless of
      # whether it's triggered by a git webhook or this CLI flag. That's
      # exactly what the first three runs of this workflow hit: `netlify
      # status` (pure auth check, no build) succeeded with this same token,
      # but `deploy --build` failed immediately with 403 Forbidden. Plain
      # `deploy` -- upload and publish an already-built artifact -- is a
      # more basic action that doesn't touch that infrastructure at all.
      #
      # `prod` defaults to false so a manual run is a draft deploy (its own
      # throwaway preview URL, printed in this step's log) -- safe to use to
      # confirm the API routes/SSR actually work before ever publishing to
      # production. Publishing a release always deploys for real; that's the
      # whole point of this workflow.
      - name: Deploy to Netlify
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.prod }}" = "true" ]; then
            npx netlify-cli@27.5.2 deploy --prod
          else
            npx netlify-cli@27.5.2 deploy
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # Not a secret -- a site's API ID is not sensitive information,
          # only its auth token is. app.quiroflow.com's Netlify site.
          NETLIFY_SITE_ID: 8a81ed5a-0561-4e1d-891a-163a223d99f8
